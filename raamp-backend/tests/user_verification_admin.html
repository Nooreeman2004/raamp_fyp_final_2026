<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Verification Admin Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-check {
            background: #667eea;
            color: white;
        }
        .btn-check:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-fix {
            background: #48bb78;
            color: white;
        }
        .btn-fix:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }
        .btn-fix:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }
        .result.success {
            background: #f0fdf4;
            border: 2px solid #86efac;
            display: block;
        }
        .result.error {
            background: #fef2f2;
            border: 2px solid #fca5a5;
            display: block;
        }
        .result.warning {
            background: #fffbeb;
            border: 2px solid #fcd34d;
            display: block;
        }
        .result h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }
        .result pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 User Verification Admin Tool</h1>
        
        <div class="input-group">
            <label for="email">User Email:</label>
            <input 
                type="email" 
                id="email" 
                placeholder="e.g., malik.noor.eman@gmail.com"
                value="malik.noor.eman@gmail.com"
            >
        </div>

        <div class="button-group">
            <button class="btn-check" onclick="checkStatus()">Check Status</button>
            <button class="btn-fix" id="fixBtn" onclick="fixUser()" disabled>Fix User</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/admin';
        let currentEmail = '';
        let needsFix = false;

        async function checkStatus() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert('Please enter an email address');
                return;
            }

            currentEmail = email;
            showLoading();
            hideResult();

            try {
                const response = await fetch(`${API_BASE}/check-user-status/${encodeURIComponent(email)}`);
                const data = await response.json();

                hideLoading();
                needsFix = data.needs_fix;
                document.getElementById('fixBtn').disabled = !needsFix;

                showResult(data, 'check');
            } catch (error) {
                hideLoading();
                showError('Failed to check user status: ' + error.message);
            }
        }

        async function fixUser() {
            if (!currentEmail || !needsFix) return;

            if (!confirm(`Fix verification status for ${currentEmail}?`)) {
                return;
            }

            showLoading();
            hideResult();

            try {
                const response = await fetch(`${API_BASE}/fix-user-verification/${encodeURIComponent(currentEmail)}`, {
                    method: 'POST'
                });
                const data = await response.json();

                hideLoading();
                showResult(data, 'fix');
                
                if (data.fixed) {
                    needsFix = false;
                    document.getElementById('fixBtn').disabled = true;
                }
            } catch (error) {
                hideLoading();
                showError('Failed to fix user: ' + error.message);
            }
        }

        function showResult(data, type) {
            const resultDiv = document.getElementById('result');
            
            if (type === 'check') {
                const statusClass = data.needs_fix ? 'warning' : 'success';
                resultDiv.className = `result ${statusClass}`;
                resultDiv.innerHTML = `
                    <h3>Status Check Results</h3>
                    <p><strong>Email:</strong> ${data.email}</p>
                    <p><strong>In Users Collection:</strong> ${data.in_users_collection ? '✅ Yes' : '❌ No'}</p>
                    <p><strong>Is Verified:</strong> ${data.is_verified === true ? '✅ Yes' : data.is_verified === false ? '❌ No' : 'N/A'}</p>
                    <p><strong>In Pending Collection:</strong> ${data.in_pending_collection ? '⚠️ Yes' : '✅ No'}</p>
                    <p><strong>Needs Fix:</strong> ${data.needs_fix ? '⚠️ Yes' : '✅ No'}</p>
                    <h4>Diagnosis:</h4>
                    <p>${data.diagnosis}</p>
                `;
            } else if (type === 'fix') {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h3>✅ Fix Applied</h3>
                    <p><strong>Email:</strong> ${data.email}</p>
                    <p><strong>Fixed:</strong> ${data.fixed ? 'Yes' : 'No'}</p>
                    <p><strong>Message:</strong> ${data.message}</p>
                    ${data.fixed ? '<p style="color: #48bb78; font-weight: 600;">User can now sign in!</p>' : ''}
                `;
            }
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `
                <h3>❌ Error</h3>
                <p>${message}</p>
            `;
        }

        function showLoading() {
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function hideResult() {
            document.getElementById('result').style.display = 'none';
        }

        // Auto-check on page load
        window.addEventListener('load', () => {
            const email = document.getElementById('email').value;
            if (email) {
                checkStatus();
            }
        });
    </script>
</body>
</html>
